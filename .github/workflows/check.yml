name: Check addon

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check addon
        run: python3 tools/check.py
      - name: Build and verify preview ZIP
        run: python3 tools/package.py
      - name: Upload installable preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForeverPlates-preview
          path: dist/ForeverPlates-*-preview.zip
